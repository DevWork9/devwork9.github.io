<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>forehead tic tac toe</title>
<meta name="description" content="pin the noughts and crosses on the forehead">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161009;
    --ink-soft:#2b2018;
    --paper:#fff8ef;
    --marker-red:#e6391f;
    --flash-pink:#ff5c8a;
    --gold:#ffce54;
    --ballpoint:#2c3968;
    --muted:#cdb9a6;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Quicksand',system-ui,sans-serif;
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  img{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  button{ font-family:inherit; }

  /* ---------- welcome screen ---------- */
  .welcome{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 50% 18%, #352918 0%, var(--ink) 62%);
  }
  .welcome.closing{ animation:welcomeExit .55s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes welcomeExit{ to{ opacity:0; transform:scale(.92) translateY(-14px); } }

  .polaroid{
    position:relative;
    width:min(88vw,340px);
    background:var(--paper);
    padding:16px 16px 22px;
    border-radius:4px;
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.06);
    transform:rotate(-2deg);
    animation:polaroidIn .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes polaroidIn{
    from{ opacity:0; transform:rotate(-2deg) translateY(26px) scale(.94); }
    to{ opacity:1; transform:rotate(-2deg) translateY(0) scale(1); }
  }

  .tape{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:88px; height:26px;
    background:rgba(255,206,84,.55);
    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }

  .photo-frame{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:2px;
    background:#000;
  }
  .emoji-photo{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:contrast(1.06) saturate(1.12);
  }
  .flash{
    position:absolute; inset:0;
    background:radial-gradient(circle at 55% 35%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%);
    mix-blend-mode:screen;
    animation:flashPop 1.1s ease-out both;
  }
  @keyframes flashPop{ from{ opacity:1; } to{ opacity:0; } }

  .scribble{
    position:absolute; left:8%; bottom:6%; right:8%;
    font-family:'Permanent Marker',cursive;
    color:var(--marker-red);
    font-size:clamp(22px,7.5vw,30px);
    line-height:1.1;
    transform:rotate(-4deg);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    opacity:0;
    animation:scribbleIn .5s ease .75s both;
  }
  @keyframes scribbleIn{
    from{ opacity:0; transform:rotate(-4deg) translateY(6px) scale(.9); }
    to{ opacity:1; transform:rotate(-4deg) translateY(0) scale(1); }
  }

  .caption{
    margin:14px 4px 0;
    font-size:12.5px;
    color:var(--ink-soft);
    opacity:.65;
    text-align:center;
  }

  .music-card{
    margin-top:12px;
    display:flex; align-items:center; gap:9px;
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:10px 12px;
  }
  .music-toggle,
  .mute-toggle{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:var(--marker-red);
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .music-toggle svg,
  .mute-toggle svg{ width:14px; height:14px; }
  .music-controls{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .song-select{
    width:100%;
    min-width:0;
    border:1px solid rgba(255,248,239,.18);
    border-radius:8px;
    padding:8px 30px 8px 9px;
    background:rgba(255,248,239,.08);
    color:var(--paper);
    font:600 12px/1.2 'Quicksand',system-ui,sans-serif;
    appearance:auto;
    -webkit-appearance:auto;
    cursor:pointer;
    touch-action:manipulation;
  }
  .song-select:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .song-select option{
    background:var(--ink);
    color:var(--paper);
  }
  .music-state{
    display:block;
    margin-top:4px;
    font-size:10.5px;
    opacity:.58;
  }
  .eq{ display:flex; align-items:flex-end; gap:2px; height:16px; flex:none; }
  .eq span{
    width:3px; background:var(--gold); border-radius:2px;
    height:4px;
    animation:none;
  }
  .eq.playing span{ animation:eqBounce .9s ease-in-out infinite; }
  .eq span:nth-child(1){ animation-delay:0s; }
  .eq span:nth-child(2){ animation-delay:.15s; }
  .eq span:nth-child(3){ animation-delay:.3s; }
  .eq span:nth-child(4){ animation-delay:.45s; }

  @keyframes eqBounce{
    0%,100%{ height:4px; }
    50%{ height:15px; }
  }

  .x-btn{
    position:absolute; top:-14px; right:-10px;
    width:38px; height:38px;
    border-radius:50%;
    border:2px solid var(--paper);
    background:var(--marker-red);
    color:var(--paper);
    font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transform:rotate(8deg);
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    touch-action:manipulation;
  }
  .x-btn:active{ transform:rotate(8deg) scale(.92); }

  #ytHolder{ position:fixed; width:2px; height:2px; overflow:hidden; opacity:0; pointer-events:none; bottom:0; left:0; }

  /* ---------- game screen ---------- */
  .game{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    gap:18px;
    padding:28px 18px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .55s ease, transform .55s ease;
  }
  .game.visible{ opacity:1; transform:none; }

  .board-stage{ width:100%; display:flex; justify-content:center; }
  .board-frame{
    position:relative;
    width:min(92vw,440px);
    aspect-ratio:1242/2208;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    background:#000;
  }
  @media (max-height:700px) and (orientation:landscape){
    .board-frame{ width:auto; height:78vh; }
  }
  .board-photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .mark-layer{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .cells{ position:absolute; inset:0; }

  .cell{
    position:absolute;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1.5px dashed rgba(255,248,239,.28);
    background:rgba(255,248,239,0);
    cursor:pointer;
    touch-action:manipulation;
    transition:background .15s ease, border-color .15s ease;
  }
  .cell:hover, .cell:focus-visible{ background:rgba(255,248,239,.1); border-color:rgba(255,248,239,.55); }
  .cell:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .cell.taken, .cell.locked{ pointer-events:none; border-color:transparent; }

  .hud{
    width:min(92vw,440px);
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .game-music{
    width:100%;
    box-sizing:border-box;
    margin-top:2px;
  }
  .game-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .status{
    font-family:'Permanent Marker',cursive;
    font-size:clamp(18px,5vw,22px);
    color:var(--gold);
    margin:0;
    text-align:center;
    min-height:1.3em;
  }
  .score{ display:flex; gap:8px; }
  .chip{
    background:rgba(255,248,239,.08);
    border:1px solid rgba(255,248,239,.18);
    border-radius:999px;
    padding:6px 14px;
    font-size:12.5px;
    font-weight:600;
    display:flex; align-items:center; gap:6px;
    color:var(--muted);
  }
  .chip b{ color:var(--paper); font-size:14px; }
  .chip.you{ border-color:rgba(230,57,31,.4); }
  .chip.ai{ border-color:rgba(44,57,104,.5); }

  .restart{
    margin-top:2px;
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:10px;
    padding:11px 26px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    transform:rotate(-1deg);
    touch-action:manipulation;
  }
  .restart:active{ transform:rotate(-1deg) scale(.96); }
  .restart.pulse{ animation:pulse 1.4s ease-in-out infinite; }
  .reset{
    margin-top:2px;
    background:transparent;
    color:var(--paper);
    border:1px solid rgba(255,248,239,.25);
    border-radius:10px;
    padding:10px 18px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .reset:active{ transform:scale(.96); }
  @keyframes pulse{ 0%,100%{ box-shadow:0 8px 18px rgba(0,0,0,.35);} 50%{ box-shadow:0 8px 26px rgba(255,206,84,.55);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

            <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8zm0-8.5v2.1A9 9 0 0 1 20 12a9 9 0 0 1-3.5 7.4v2.1A11 11 0 0 0 22 12 11 11 0 0 0 16.5 3.5z"/>
          </svg>
          <svg id="mutedIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <path d="M3 9v6h4l5 4V5L7 9H3zm13.6 1.6 2.1-2.1 1.3 1.3-2.1 2.1 2.1 2.1-1.3 1.3-2.1-2.1-2.1 2.1-1.3-1.3 2.1-2.1-2.1-2.1 1.3-1.3 2.1 2.1z"/>
          </svg>
        </button>

        <div class="eq" id="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>

      <div class="game-actions">
        <button class="restart" id="restart">restart</button>
        <button class="reset" id="reset">reset</button>
      </div>
    </div>
  </main>

<script>
(function(){
  "use strict";

  /* ======================================================
     1. best-effort device greeting
     Safari deliberately does not expose the exact iPhone
     model to web pages, so this guesses from screen size
     (physical pixels = CSS px * devicePixelRatio), which
     Apple reuses across several models sharing a screen
     class. It cannot perfectly tell an iPhone 12 from a 13
     or 14 (identical screens) -- it's the closest signal
     available from a browser.
  ====================================================== */
  function detectGreeting(){
    var ua = navigator.userAgent || '';
    var isIPhone = /iPhone/.test(ua);
    if (!isIPhone) return 'Welcome!';
    var dpr = window.devicePixelRatio || 1;
    var w = Math.round(window.screen.width * dpr);
    var h = Math.round(window.screen.height * dpr);
    var shortSide = Math.min(w, h);
    var longSide = Math.max(w, h);
    var key = shortSide + 'x' + longSide;
    // iPhone 12 Pro Max / 13 Pro Max / 14 Plus all report 1284x2778
    if (key === '1284x2778') return 'Welcome Tania!';
    // iPhone 12 / 12 Pro / 13 / 13 Pro / 14 all report 1170x2532
    if (key === '1170x2532') return 'Welcome Maryan!';
    return 'Welcome Yalda!';
  }
  document.getElementById('welcomeText').textContent = detectGreeting();

  /* ======================================================
     2. music card, backed by the YouTube IFrame API
     Three selectable YouTube tracks + mute/unmute.
     Safari/iOS may block audible autoplay until a user
     gesture; the first tap on this card or the X button
     is used to unlock playback when necessary.
  ====================================================== */
  var menuPlayer = null;
  var ytPlayer = null;
  var menuReady = false;
  var ytReady = false;
  var menuPlaying = false;
  var isMuted = true;
  var currentVideoId = 'Ktc9Oh9TXdE';
  var menuVideoId = 'K4tBHGyZuME';

  var menuEqEl = document.getElementById('menuEq');
  var menuPlayIcon = document.getElementById('menuPlayIcon');
  var menuPauseIcon = document.getElementById('menuPauseIcon');
  var eqEl = document.getElementById('eq');
  var playIcon = document.getElementById('playIcon');
  var pauseIcon = document.getElementById('pauseIcon');
  var musicStateEl = document.getElementById('musicState');
  var songSelectEl = document.getElementById('songSelect');
  var muteToggleEl = document.getElementById('muteToggle');
  var volumeIcon = document.getElementById('volumeIcon');
  var mutedIcon = document.getElementById('mutedIcon');

  function setMenuPlayingUI(isPlaying){
    // Only show the pause icon when YouTube has CONFIRMED that the
    // menu song is actually playing. A play request by itself is not
    // enough because Safari/iOS can reject or delay playback.
    menuPlaying = isPlaying === true;
    menuEqEl.classList.toggle('playing', menuPlaying);
    menuPlayIcon.style.display = menuPlaying ? 'none' : '';
    menuPauseIcon.style.display = menuPlaying ? '' : 'none';
    document.getElementById('menuMusicToggle').setAttribute(
      'aria-label', menuPlaying ? 'Pause menu song' : 'Play menu song'
    );
  }

  function syncMenuPlayingUI(){
    if (!menuReady || !menuPlayer || !window.YT || !YT.PlayerState){
      setMenuPlayingUI(false);
      return;
    }
    try{
      setMenuPlayingUI(menuPlayer.getPlayerState() === YT.PlayerState.PLAYING);
    }catch(e){
      setMenuPlayingUI(false);
    }
  }

  function setPlayingUI(isPlaying){
    eqEl.classList.toggle('playing', isPlaying);
    playIcon.style.display = isPlaying ? 'none' : '';
    pauseIcon.style.display = isPlaying ? '' : 'none';
    document.getElementById('musicToggle').setAttribute(
      'aria-label', isPlaying ? 'Pause song' : 'Play song'
    );
  }

  function setMuteUI(muted){
    isMuted = !!muted;
    volumeIcon.style.display = isMuted ? 'none' : '';
    mutedIcon.style.display = isMuted ? '' : 'none';
    muteToggleEl.setAttribute('aria-label', isMuted ? 'Unmute song' : 'Mute song');
    muteToggleEl.title = isMuted ? 'Unmute' : 'Mute';
    musicStateEl.textContent = isMuted ? 'Muted' : 'Audio enabled';
  }

  function requestPlay(){
    if (!ytReady || !ytPlayer) return;
    try{
      if (isMuted) ytPlayer.mute();
      else ytPlayer.unMute();
      ytPlayer.playVideo();
    }catch(e){}
  }

  function loadSong(videoId, autoplay){
    if (!videoId) return;
    currentVideoId = videoId;
    if (!ytReady || !ytPlayer) {
      musicStateEl.textContent = 'Loading song…';
      return;
    }

    try{
      if (isMuted) ytPlayer.mute();
      else ytPlayer.unMute();

      if (autoplay) {
        ytPlayer.loadVideoById(videoId);
        musicStateEl.textContent = isMuted ? 'Playing — muted' : 'Playing';
      } else {
        ytPlayer.cueVideoById(videoId);
        setPlayingUI(false);
        musicStateEl.textContent = 'Ready';
      }
    }catch(e){
      musicStateEl.textContent = 'Tap play to start';
    }
  }

  window.onYouTubeIframeAPIReady = function(){
    menuPlayer = new YT.Player('menuPlayer', {
      videoId: menuVideoId,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, controls: 0, modestbranding: 1 },
      events: {
        onReady: function(e){
          menuReady = true;
          // Start muted for autoplay compatibility, but do NOT mark the
          // button as playing until YouTube sends a PLAYING state.
          setMenuPlayingUI(false);
          try{
            e.target.mute();
            e.target.playVideo();
          }catch(err){}
          setTimeout(syncMenuPlayingUI, 150);
          setTimeout(syncMenuPlayingUI, 800);
        },
        onStateChange: function(e){
          // BUFFERING / UNSTARTED are deliberately treated as not playing.
          // This prevents the pause icon from getting stuck when autoplay
          // is blocked or the video is still loading.
          setMenuPlayingUI(e.data === YT.PlayerState.PLAYING);
        }
      }
    });

    ytPlayer = new YT.Player('ytPlayer', {
      videoId: currentVideoId,
      playerVars: { autoplay: 0, playsinline: 1, rel: 0, controls: 0, modestbranding: 1 },
      events: {
        onReady: function(e){
          ytReady = true;
          try{ e.target.mute(); }catch(err){}
          setMuteUI(true);
        },
        onStateChange: function(e){
          var state = e.data;
          if (state === YT.PlayerState.PLAYING){
            setPlayingUI(true);
            musicStateEl.textContent = isMuted ? 'Playing — muted' : 'Playing';
          } else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED || state === YT.PlayerState.CUED){
            setPlayingUI(false);
            if (state === YT.PlayerState.ENDED) musicStateEl.textContent = 'Song ended';
          }
        }
      }
    });
  };

  var ytTag = document.createElement('script');
  ytTag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(ytTag);

  document.getElementById('menuMusicToggle').addEventListener('click', function(){
    if (!menuReady || !menuPlayer) return;
    try{
      var state = menuPlayer.getPlayerState();

      if (state === YT.PlayerState.PLAYING){
        menuPlayer.pauseVideo();
        // Do not rely on the click to decide the final state.
        // Wait for YouTube's actual state event and verify shortly after.
        setMenuPlayingUI(false);
        setTimeout(syncMenuPlayingUI, 100);
      }else{
        // A user click is a valid gesture for Safari/iPhone.
        menuPlayer.unMute();
        menuPlayer.playVideo();
        // Keep the play icon visible until PLAYING is confirmed.
        setMenuPlayingUI(false);
        setTimeout(syncMenuPlayingUI, 100);
        setTimeout(syncMenuPlayingUI, 500);
      }
    }catch(e){
      setMenuPlayingUI(false);
    }
  });

  document.getElementById('musicToggle').addEventListener('click', function(){
    if (!ytReady || !ytPlayer) {
      musicStateEl.textContent = 'Loading song…';
      return;
    }

    try{
      var state = ytPlayer.getPlayerState();

      if (state === YT.PlayerState.PLAYING){
        ytPlayer.pauseVideo();
      } else {
        // A click is a user gesture, so this is the key Safari/iPhone
        // path for unlocking audible playback if autoplay was blocked.
        if (isMuted) ytPlayer.unMute();
        ytPlayer.playVideo();
        musicStateEl.textContent = isMuted ? 'Playing — muted' : 'Playing';
      }
    }catch(e){}
  });

  muteToggleEl.addEventListener('click', function(){
    if (!ytReady || !ytPlayer) return;

    try{
      if (isMuted){
        ytPlayer.unMute();
        isMuted = false;
        musicStateEl.textContent = 'Audio enabled';
      } else {
        ytPlayer.mute();
        isMuted = true;
        musicStateEl.textContent = 'Muted';
      }
      setMuteUI(isMuted);
    }catch(e){}
  });

  songSelectEl.addEventListener('change', function(){
    loadSong(this.value, true);
  });

  // First direct interaction with the music card can unlock sound on Safari.
  songSelectEl.addEventListener('pointerdown', function(){
    if (ytReady && ytPlayer && isMuted){
      try{
        ytPlayer.unMute();
        setMuteUI(false);
      }catch(e){}
    }
  }, {passive:true});

  function stopMenuMusic(){
    try{
      if (menuReady && menuPlayer && menuPlayer.stopVideo) menuPlayer.stopVideo();
    }catch(e){}
    setMenuPlayingUI(false);
  }

  function stopMusic(){
    try{
      if (ytReady && ytPlayer && ytPlayer.stopVideo) {
        ytPlayer.stopVideo();
      }
    }catch(e){}
  }

  /* ======================================================
     3. welcome -> game transition
  ====================================================== */
  var welcomeEl = document.getElementById('welcome');
  var gameEl = document.getElementById('game');

  document.getElementById('closeWelcome').addEventListener('click', function(){
    stopMenuMusic();
    welcomeEl.classList.add('closing');
    setTimeout(function(){
      welcomeEl.style.display = 'none';
      gameEl.classList.add('visible');
      gameEl.removeAttribute('aria-hidden');

      // Keep the selected song playing as the game opens. If the
      // browser blocked autoplay, the in-game play button remains
      // available and the tap is treated as the user gesture.
      if (ytReady && ytPlayer){
        try{
          if (isMuted) ytPlayer.mute();
          ytPlayer.playVideo();
        }catch(e){}
      }
    }, 550);
  });

  /* ======================================================
     4. board geometry
     these coordinates are pixel positions (in the original
     1242 x 2208 photo) for the centre of each of the 9
     cells, taken from where the noughts-and-crosses grid
     is actually drawn on the forehead.
  ====================================================== */
  var IMG_W = 1242, IMG_H = 2208, CELL_PX = 158;
  var CELL_COORDS = [
    {x:537, y:867}, {x:704, y:853}, {x:871, y:833},
    {x:537, y:1027},{x:717, y:1014},{x:851, y:994},
    {x:577, y:1187},{x:724, y:1160},{x:871, y:1147}
  ];
  var WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  var cellsEl = document.getElementById('cells');
  var markLayer = document.getElementById('markLayer');
  var statusEl = document.getElementById('status');
  var restartBtn = document.getElementById('restart');
  var scoreYouEl = document.getElementById('scoreYou');
  var scoreAIEl = document.getElementById('scoreAI');
  var scoreDrawEl = document.getElementById('scoreDraw');
  var resetBtn = document.getElementById('reset');

  var scores = { you:0, ai:0, draw:0 };
  var board, gameOver, humansTurn, cellEls;
  var HUMAN = 'X', AI = 'O';

  function pct(v, dim){ return (v/dim*100); }

  function buildCells(){
    cellsEl.innerHTML = '';
    cellEls = CELL_COORDS.map(function(c, i){
      var btn = document.createElement('button');
      btn.className = 'cell';
      btn.style.left = pct(c.x, IMG_W) + '%';
      btn.style.top = pct(c.y, IMG_H) + '%';
      btn.style.width = pct(CELL_PX, IMG_W) + '%';
      btn.style.height = pct(CELL_PX, IMG_H) + '%';
      btn.setAttribute('aria-label', 'square ' + (i+1));
      btn.addEventListener('click', function(){ onCellClick(i); });
      cellsEl.appendChild(btn);
      return btn;
    });
  }

  function svgNS(tag){ return document.createElementNS('http://www.w3.org/2000/svg', tag); }

  function drawX(i){
    var c = CELL_COORDS[i], r = 46;
    var g = svgNS('g');
    [[c.x-r,c.y-r,c.x+r,c.y+r],[c.x+r,c.y-r,c.x-r,c.y+r]].forEach(function(pts, idx){
      var line = svgNS('line');
      line.setAttribute('x1', pts[0]); line.setAttribute('y1', pts[1]);
      line.setAttribute('x2', pts[2]); line.setAttribute('y2', pts[3]);
      line.setAttribute('stroke', '#e6391f');
      line.setAttribute('stroke-width', '20');
      line.setAttribute('stroke-linecap', 'round');
      var len = Math.hypot(pts[2]-pts[0], pts[3]-pts[1]);
      line.setAttribute('stroke-dasharray', len);
      line.setAttribute('stroke-dashoffset', len);
      line.style.animation = 'dash .28s ease ' + (idx*0.12) + 's forwards';
      g.appendChild(line);
    });
    markLayer.appendChild(g);
  }

  function drawO(i){
    var c = CELL_COORDS[i], r = 50;
    var circle = svgNS('circle');
    circle.setAttribute('cx', c.x); circle.setAttribute('cy', c.y);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', 'none');
    circle.setAttribute('stroke', '#2c3968');
    circle.setAttribute('stroke-width', '18');
    circle.setAttribute('stroke-linecap', 'round');
    var len = 2 * Math.PI * r;
    circle.setAttribute('stroke-dasharray', len);
    circle.setAttribute('stroke-dashoffset', len);
    circle.setAttribute('transform', 'rotate(-90 ' + c.x + ' ' + c.y + ')');
    circle.style.animation = 'dash .4s ease forwards';
    markLayer.appendChild(circle);
  }

  function drawWinLine(line){
    var a = CELL_COORDS[line[0]], b = CELL_COORDS[line[2]];
    var l = svgNS('line');
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
    l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
    l.setAttribute('stroke', '#ffce54');
    l.setAttribute('stroke-width', '14');
    l.setAttribute('stroke-linecap', 'round');
    l.setAttribute('opacity', '0.9');
    var len = Math.hypot(b.x-a.x, b.y-a.y);
    l.setAttribute('stroke-dasharray', len);
    l.setAttribute('stroke-dashoffset', len);
    l.style.animation = 'dash .45s ease forwards';
    markLayer.appendChild(l);
  }

  var styleTag = document.createElement('style');
  styleTag.textContent = '@keyframes dash{to{stroke-dashoffset:0;}}';
  document.head.appendChild(styleTag);

  function checkResult(b){
    for (var w=0; w<WINS.length; w++){
      var line = WINS[w];
      if (b[line[0]] && b[line[0]]===b[line[1]] && b[line[0]]===b[line[2]]){
        return { winner:b[line[0]], line:line };
      }
    }
    if (b.every(function(v){ return v; })) return { winner:'draw', line:null };
    return null;
  }

  function minimax(b, player, depth){
    var result = checkResult(b);
    if (result){
      if (result.winner === AI) return { score: 10 - depth };
      if (result.winner === HUMAN) return { score: depth - 10 };
      return { score: 0 };
    }
    var moves = [];
    for (var i=0;i<9;i++){
      if (!b[i]){
        b[i] = player;
        var outcome = minimax(b, player === AI ? HUMAN : AI, depth+1);
        moves.push({ index:i, score:outcome.score });
        b[i] = null;
      }
    }
    var best = moves[0];
    if (player === AI){
      moves.forEach(function(m){ if (m.score > best.score) best = m; });
    } else {
      moves.forEach(function(m){ if (m.score < best.score) best = m; });
    }
    var ties = moves.filter(function(m){ return m.score === best.score; });
    return { score: best.score, options: ties };
  }

  function bestAIMove(b){
    var result = minimax(b.slice(), AI, 0);
    var pick = result.options[Math.floor(Math.random() * result.options.length)];
    return pick.index;
  }

  function setStatus(text){ statusEl.textContent = text; }

  function endGame(result){
    gameOver = true;
    cellEls.forEach(function(c){ c.classList.add('locked'); });
    if (result.line) drawWinLine(result.line);
    if (result.winner === HUMAN){ scores.you++; setStatus('you win!'); }
    else if (result.winner === AI){ scores.ai++; setStatus('ai wins — rematch?'); }
    else { scores.draw++; setStatus("draw — tania's forehead is too big"); }
    scoreYouEl.textContent = scores.you;
    scoreAIEl.textContent = scores.ai;
    scoreDrawEl.textContent = scores.draw;
    restartBtn.classList.add('pulse');
  }

  function aiMove(){
    setStatus('ai is thinking…');
    setTimeout(function(){
      var i = bestAIMove(board);
      board[i] = AI;
      drawO(i);
      cellEls[i].classList.add('taken');
      var result = checkResult(board);
      if (result) return endGame(result);
      humansTurn = true;
      setStatus('your move');
    }, 450 + Math.random()*300);
  }

  function onCellClick(i){
    if (gameOver || !humansTurn || board[i]) return;
    board[i] = HUMAN;
    drawX(i);
    cellEls[i].classList.add('taken');
    humansTurn = false;
    var result = checkResult(board);
    if (result) return endGame(result);
    aiMove();
  }

  function startGame(){
    board = new Array(9).fill(null);
    gameOver = false;
    humansTurn = true;
    markLayer.innerHTML = '';
    restartBtn.classList.remove('pulse');
    buildCells();
    setStatus('your move');
  }

  restartBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', function(){
    scores = { you:0, ai:0, draw:0 };
    scoreYouEl.textContent = '0';
    scoreAIEl.textContent = '0';
    scoreDrawEl.textContent = '0';
    startGame();
    if (ytReady && ytPlayer){
      try{
        ytPlayer.stopVideo();
        ytPlayer.mute();
        isMuted = true;
        setMuteUI(true);
        ytPlayer.playVideo();
      }catch(e){}
    }
  });
  startGame();

})();
</script>
</body>
</html>
